<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Opsburg: build your flying city, run real infrastructure">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#1d3352"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d27a"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#b87333"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4a3a"/>
      <stop offset="1" stop-color="#2a2119"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <g fill="#e8e1d3" opacity="0.1">
    <ellipse cx="900" cy="260" rx="260" ry="26"/>
    <ellipse cx="200" cy="285" rx="240" ry="18"/>
  </g>

  <!-- logo -->
  <g transform="translate(80 95)">
    <circle cx="55" cy="55" r="44" fill="none" stroke="url(#brass)" stroke-width="14" stroke-dasharray="15 9"/>
    <circle cx="55" cy="55" r="25" fill="#0f1c2e" stroke="url(#brass)" stroke-width="6"/>
    <path d="M55 55 L55 39 M55 55 L67 60" stroke="#f4ecd8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="220" y="150" font-family="Cinzel, Georgia, serif" font-size="72" font-weight="700" fill="url(#brass)">OPSBURG</text>
  <text x="222" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#f4ecd8">Build your flying city. Run real infrastructure.</text>

  <!-- island -->
  <g transform="translate(880 70)">
    <path d="M0 120 Q110 100 220 120 L185 160 Q150 215 110 225 Q70 215 35 160 Z" fill="url(#rock)"/>
    <rect x="4" y="111" width="212" height="12" rx="5" fill="#4d6b3c"/>
    <rect x="94" y="10" width="30" height="102" fill="#3b2f25" stroke="url(#brass)" stroke-width="2"/>
    <path d="M89 12 L109 -18 L129 12 Z" fill="url(#brass)"/>
    <circle cx="109" cy="36" r="11" fill="#f4ecd8" stroke="url(#brass)" stroke-width="3"/>
    <rect x="30" y="72" width="48" height="40" fill="#4a3a2c" stroke="url(#brass)" stroke-width="1.5"/>
    <rect x="140" y="80" width="62" height="32" fill="#4a3a2c" stroke="url(#brass)" stroke-width="1.5"/>
    <g fill="#f1d27a" opacity="0.85">
      <rect x="40" y="86" width="8" height="10"/><rect x="60" y="86" width="8" height="10"/>
      <rect x="150" y="90" width="8" height="10"/><rect x="168" y="90" width="8" height="10"/><rect x="186" y="90" width="8" height="10"/>
    </g>
  </g>
  <!-- airship -->
  <g transform="translate(700 40)">
    <ellipse cx="60" cy="30" rx="58" ry="18" fill="#e8e1d3"/>
    <path d="M112 22 L132 14 L132 46 L112 38 Z" fill="url(#brass)"/>
    <rect x="42" y="54" width="38" height="12" rx="3" fill="#4a3a2c" stroke="url(#brass)" stroke-width="1.5"/>
  </g>
</svg>
